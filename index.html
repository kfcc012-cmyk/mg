<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --border: #e5e7eb;
      --highlight: #fff3a3;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(1040px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .search-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .all-button {
      height: 50px;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
    }

    .all-button:hover {
      filter: brightness(0.96);
    }

    .category-wrap {
      margin-top: 16px;
    }

    .category-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      border: 1px solid var(--border);
      background: #fff;
      color: #374151;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-button:hover {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .category-button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .result-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 2px 14px;
      gap: 12px;
    }

    .result-count {
      font-size: 15px;
      font-weight: 700;
    }

    .current-filter {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .faq-list {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .faq-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .question {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.5;
    }

    .category-badge {
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1d4ed8;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .answer {
      margin: 0;
      color: #4b5563;
      line-height: 1.75;
      font-size: 15px;
    }

    mark {
      background: var(--highlight);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .empty {
      background: var(--card);
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 1040px);
        margin: 24px auto;
      }

      .title {
        font-size: 26px;
      }

      .search-row {
        flex-direction: column;
      }

      .all-button {
        width: 100%;
      }

      .result-toolbar,
      .faq-top {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">업무 FAQ 검색</h1>
      <p class="subtitle">질문이나 키워드를 입력해 FAQ를 빠르게 찾아보세요.</p>
    </header>

    <section class="search-panel" aria-label="FAQ 검색">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          autocomplete="off"
        />
        <button id="showAllButton" class="all-button" type="button">전체보기</button>
      </div>

      <div class="category-wrap">
        <span class="category-label">분류</span>
        <div id="categoryButtons" class="categories"></div>
      </div>
    </section>

    <section aria-live="polite">
      <div class="result-toolbar">
        <div id="resultCount" class="result-count"></div>
        <div id="currentFilter" class="current-filter"></div>
      </div>
      <div id="faqList" class="faq-list"></div>
    </section>
  </main>

  <script>
    // 첨부 JSON에 있는 FAQ 데이터만 사용합니다.
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const categories = ["전체", "교육", "문서", "IT", "보안"];

    const searchInput = document.getElementById("searchInput");
    const showAllButton = document.getElementById("showAllButton");
    const categoryButtons = document.getElementById("categoryButtons");
    const resultCount = document.getElementById("resultCount");
    const currentFilter = document.getElementById("currentFilter");
    const faqList = document.getElementById("faqList");

    let selectedCategory = "전체";

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmed = keyword.trim();

      if (!trimmed) return safeText;

      const pattern = new RegExp(`(${escapeRegExp(trimmed)})`, "gi");
      return safeText.replace(pattern, "<mark>$1</mark>");
    }

    function createCategoryButtons() {
      categoryButtons.innerHTML = categories.map(category => `
        <button
          type="button"
          class="category-button ${category === selectedCategory ? "active" : ""}"
          data-category="${category}"
        >
          ${category}
        </button>
      `).join("");

      categoryButtons.querySelectorAll(".category-button").forEach(button => {
        button.addEventListener("click", () => {
          selectedCategory = button.dataset.category;
          createCategoryButtons();
          renderFaqs();
        });
      });
    }

    function renderFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = faqData.filter(item => {
        const matchesCategory =
          selectedCategory === "전체" || item.category === selectedCategory;

        const combinedText =
          `${item.question} ${item.answer} ${item.category}`.toLowerCase();

        const matchesKeyword =
          keyword === "" || combinedText.includes(keyword);

        return matchesCategory && matchesKeyword;
      });

      resultCount.textContent = `검색 결과 ${filtered.length}건`;

      const filterText = [];
      if (selectedCategory !== "전체") filterText.push(`분류: ${selectedCategory}`);
      if (searchInput.value.trim()) filterText.push(`검색어: "${searchInput.value.trim()}"`);
      currentFilter.textContent = filterText.length ? filterText.join(" · ") : "전체 FAQ";

      if (filtered.length === 0) {
        faqList.innerHTML = `
          <div class="empty">
            등록된 FAQ에서 답변을 찾을 수 없습니다.<br><br>
            관련 담당부서 또는 공식 안내자료를 확인해 주세요.
          </div>
        `;
        return;
      }

      faqList.innerHTML = filtered.map(item => `
        <article class="faq-card">
          <div class="faq-top">
            <h2 class="question">${highlight(item.question, searchInput.value)}</h2>
            <span class="category-badge">${highlight(item.category, searchInput.value)}</span>
          </div>
          <p class="answer">${highlight(item.answer, searchInput.value)}</p>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", renderFaqs);

    showAllButton.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";
      createCategoryButtons();
      renderFaqs();
      searchInput.focus();
    });

    createCategoryButtons();
    renderFaqs();
  </script>
</body>
</html>
